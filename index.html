<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EE">
  <meta name="description" content="LINGER 一碟呷甘，一味流連 — 內用掃碼點餐。A plate of lingering sweetness, a flavor that keeps you staying.">
  <title>LINGER · 一碟呷甘，一味流連</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要內容 · Skip to content</a>

  <div class="app-shell">
    <!-- 品牌側欄（桌面版）；行動版品牌區由 menu-hero 呈現 -->
    <aside class="brand-panel">
      <div class="brand-head">
        <h1 class="brand-name">LINGER</h1>
        <p class="brand-name-sub" aria-hidden="true">Macau · Taiwan Kitchen</p>
      </div>
      <div id="side-brand-quote"></div>
      <nav id="side-nav" class="side-nav" aria-label="菜單分類"></nav>
      <div id="side-foot" class="side-foot"></div>
    </aside>

    <div class="main-panel">
      <header class="top-bar">
        <span class="top-bar-brand" aria-hidden="true">LINGER</span>
        <button type="button" class="table-chip" id="table-chip" aria-label="目前桌號，點擊更換" aria-haspopup="dialog">
          <span class="table-chip-label">Table</span>
          <span id="table-chip-value">—</span>
        </button>
        <button type="button" class="cart-button" id="cart-button" aria-label="查看購物車">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 7h12l-1.2 12.2a1.6 1.6 0 0 1-1.6 1.4H8.8a1.6 1.6 0 0 1-1.6-1.4L6 7Z"/>
            <path d="M9 9V6a3 3 0 0 1 6 0v3"/>
          </svg>
          <span class="cart-count" id="cart-count" hidden>0</span>
        </button>
      </header>

      <main id="main-content" class="main-content" tabindex="-1">
        <section class="view view--active" id="view-menu" data-view="menu" aria-label="菜單">
          <div class="menu-hero" id="menu-hero"></div>
          <div class="menu-nav">
            <nav id="cat-nav" class="cat-nav" aria-label="菜單分類"></nav>
            <div id="sub-nav" class="sub-nav" hidden></div>
          </div>
          <div class="menu-grid" id="menu-grid"></div>
          <div class="menu-foot" id="menu-foot"></div>
        </section>

        <section class="view" id="view-cart" data-view="cart" aria-label="購物車" hidden></section>
        <section class="view" id="view-checkout" data-view="checkout" aria-label="結帳" hidden></section>
        <section class="view" id="view-success" data-view="success" aria-label="訂單確認" hidden></section>
      </main>
    </div>
  </div>

  <!-- 行動版底部購物車列 -->
  <div class="cart-bar" id="cart-bar" hidden></div>

  <!-- 全域掛載點 -->
  <div class="modal-root" id="modal-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div class="sending-overlay" id="sending-overlay" hidden></div>

  <noscript>
    <p class="noscript-note">此點餐網頁需要啟用 JavaScript 才能使用，請開啟瀏覽器的 JavaScript 後重新整理。</p>
  </noscript>

  <script src="js/menu-data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
